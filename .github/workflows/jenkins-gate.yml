
name: Jenkins CI Gate

on:
  push:
    branches: [main]

permissions:
  checks: read

jobs:
  jenkins-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Wait for Jenkins checks
        uses: actions/github-script@v7
        with:
          script: |
            const expected = [
              'Jenkins',
              'Tests / Frontend Tests',
              'Tests / Backend Tests'
            ];

            for (let attempt = 0; attempt < 80; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100
              });

              const latest = new Map();

              for (const check of data.check_runs) {
                if (check.app?.id !== 5499406) continue;

                if (!latest.has(check.name) ||
                    latest.get(check.name).id < check.id) {
                  latest.set(check.name, check);
                }
              }

              const results = expected.map(name => latest.get(name));

              if (results.every(check => check?.status === 'completed')) {
                const failed = results.filter(
                  check => check.conclusion !== 'success'
                );

                if (failed.length) {
                  core.setFailed('Jenkins checks failed: ' +
                    failed.map(check => check.name).join(', '));
                } else {
                  core.info('All Jenkins checks passed.');
                }
                return;
              }

              await new Promise(resolve => setTimeout(resolve, 15000));
            }

            core.setFailed('Timed out waiting for Jenkins checks.');
