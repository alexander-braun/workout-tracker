<div class="header-actions">
  <button
    pButton
    [type]="saveButtonType()"
    [text]="true"
    severity="success"
    class="header-icon-button"
    [aria-label]="saveTitle()"
    [title]="saveTitle()"
    [disabled]="!readyForSave()"
    (click)="onSaveClick()"
  >
    <i class="pi pi-save" pButtonIcon></i>
  </button>

  @if (hasSavedEntry()) {
    <button
      pButton
      type="button"
      [text]="true"
      severity="danger"
      class="header-icon-button"
      [aria-label]="deleteTitle()"
      [title]="deleteTitle()"
      [disabled]="!readyForDelete()"
      (click)="delete.emit()"
    >
      <i class="pi pi-trash" pButtonIcon></i>
    </button>
  }

  @if (hasCustomAction()) {
    <button
      pButton
      type="button"
      [text]="true"
      severity="info"
      class="header-icon-button"
      [aria-label]="customActionTitle()"
      [title]="customActionTitle()"
      [disabled]="customActionDisabled()"
      (click)="customAction.emit()"
    >
      <i [class]="customActionIcon()" pButtonIcon></i>
    </button>
  }
</div>
