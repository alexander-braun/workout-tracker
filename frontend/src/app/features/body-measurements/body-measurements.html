<section class="card body-measurements">
  <header class="body-measurements-header">
    <h2>Body Measurements</h2>
    <p>Track key measurements over time.</p>
  </header>

  <div class="body-measurements-content">
    <div class="body-visual">
      <frontend-body />
    </div>

    <div class="measurement-form">
      <header class="measurement-form-header">
        <h3>Measurements</h3>
        <p>Enter your measurements for the selected date.</p>
      </header>

      <div class="measurement-columns">
        <div class="measurement-column">
          @for (measurement of leftMeasurements; track measurement.key) {
            <label class="measurement-row">
              <span>{{ measurement.label }}</span>

              <div class="measurement-input">
                <p-inputnumber
                  [(ngModel)]="measurement.value"
                  [minFractionDigits]="1"
                  [maxFractionDigits]="1"
                  [useGrouping]="false"
                />

                <span class="unit">
                  {{ measurement.unit }}
                </span>
              </div>
            </label>
          }
        </div>

        <div class="measurement-column">
          @for (measurement of rightMeasurements; track measurement.key) {
            <label class="measurement-row">
              <span>{{ measurement.label }}</span>

              <div class="measurement-input">
                <p-inputnumber
                  [(ngModel)]="measurement.value"
                  [minFractionDigits]="1"
                  [maxFractionDigits]="1"
                  [useGrouping]="false"
                />

                <span class="unit">
                  {{ measurement.unit }}
                </span>
              </div>
            </label>
          }
        </div>
      </div>

      <button
        pButton
        type="button"
        class="save-measurements"
        (click)="saveMeasurements()"
      >
        <span pButtonLabel>Save Measurements</span>
      </button>
    </div>
  </div>
</section>
