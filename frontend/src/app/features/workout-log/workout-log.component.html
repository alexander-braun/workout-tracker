<section class="card">
  <header class="card-header">
    <div>
      <h2>Workout Log</h2>
      <p>Track your workout progress</p>
    </div>
    <frontend-header-actions
      [hasSavedEntry]="hasSavedWorkout()"
      deleteTitle="Delete Workout"
      saveTitle="Save Workout"
      (delete)="deleteWorkout()"
      (save)="saveWorkout()"
      [readyForDelete]="workoutReady()"
      [readyForSave]="workoutReady() && isWorkoutValid()"
      saveButtonType="button"
    ></frontend-header-actions>
  </header>

  @if (workoutStore.workoutSaveInProgress()) {
    <frontend-loading text="Saving..." />
  } @else if (workoutStore.workoutsLoading()) {
    <frontend-loading text="Loading your workouts..." />
  } @else {
    <div class="exercise-table-scroll">
      <div class="exercise-grid header-row">
        <span>Exercise</span>
        <span>Sets</span>
        <span>Reps</span>
        <span></span>
        <span>Weight / Unit</span>
        <span>Notes</span>
        <span></span>
      </div>

      @for (workoutEntry of workoutEntries(); track $index; let i = $index) {
        <div class="exercise-grid">
          <p-autocomplete
            [ngModel]="getExerciseValue(workoutEntry)"
            [suggestions]="filteredExercises()"
            optionLabel="name"
            [forceSelection]="false"
            [dropdown]="true"
            appendTo="body"
            (completeMethod)="filterExercises($event, i)"
            (onSelect)="selectExercise(i, $event.value)"
            (onBlur)="onExerciseBlur(i, $event)"
          />

          <p-inputnumber [(ngModel)]="workoutEntry.sets" [showButtons]="false" (keydown.enter)="saveWorkout()" />
          <p-inputnumber [(ngModel)]="workoutEntry.reps" [showButtons]="false" (keydown.enter)="saveWorkout()" />
          <span class="multiply">×</span>
          <div class="weight">
            <p-inputnumber
              [(ngModel)]="workoutEntry.weight"
              [showButtons]="false"
              [minFractionDigits]="0"
              [maxFractionDigits]="2"
              [useGrouping]="false"
              placeholder="—"
              (keydown.enter)="saveWorkout()"
            />
            <p-select
              appendTo="body"
              [options]="unitOptions"
              [ngModel]="workoutEntry.unit"
              (ngModelChange)="setWorkoutUnit(workoutEntry, $event)"
            />
          </div>
          <input pInputText [(ngModel)]="workoutEntry.notes" (keydown.enter)="saveWorkout()" />

          <div class="row-actions">
            <button
              pButton
              type="button"
              severity="secondary"
              [text]="true"
              class="row-action-button"
              aria-label="Move exercise up"
              title="Move up"
              [disabled]="i === 0"
              (click)="moveWorkoutEntry(i, -1)"
            >
              <i class="pi pi-chevron-up" pButtonIcon></i>
            </button>

            <button
              pButton
              type="button"
              severity="secondary"
              [text]="true"
              class="row-action-button"
              aria-label="Move exercise down"
              title="Move down"
              [disabled]="i === workoutEntries().length - 1"
              (click)="moveWorkoutEntry(i, 1)"
            >
              <i class="pi pi-chevron-down" pButtonIcon></i>
            </button>

            <button
              pButton
              type="button"
              severity="secondary"
              [text]="true"
              class="remove-button"
              aria-label="Remove exercise"
              (click)="removeWorkoutEntry(i)"
            >
              <i class="pi pi-times" pButtonIcon></i>
            </button>
          </div>
        </div>
      }
    </div>
  }

  <footer class="card-footer">
    <button pButton type="button" class="add-exercise-button" (click)="addWorkoutEntry()">
      <i class="pi pi-plus" pButtonIcon></i>
      <span pButtonLabel>Add Exercise</span>
    </button>
  </footer>

  <frontend-history-section title="Workout History">
    <ng-template>
      <frontend-workout-history />
    </ng-template>
  </frontend-history-section>
</section>
