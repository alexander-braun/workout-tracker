<div class="page">
  <header class="header">
    <div>
      <h1 class="heading">Workout Tracker</h1>
    </div>
    <div class="header-actions">
      <frontend-datepicker
        [selectedDate]="store.selectedDate()"
        (selectedDateChange)="store.setSelectedDate($event)"
        [disabled]="savingInProgress()"
      />
      <p-menu
        styleClass="account-menu"
        #accountMenu
        [model]="accountMenuItems()"
        [popup]="true"
        appendTo="body"
      />
      <button
        pButton
        type="button"
        [outlined]="true"
        severity="secondary"
        class="menu-button"
        [class.logged-in]="authStore.authenticated()"
        aria-label="Account"
        (click)="accountMenu.toggle($event)"
      >
        <i class="pi pi-user"></i>
      </button>
    </div>
  </header>
  <frontend-workout-log />
  <frontend-body-log />
  <frontend-nutrition-and-sleep-log />
</div>

<p-dialog
  header=""
  [(visible)]="registerDialogVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
>
  <frontend-register-form
    (loginRequested)="loginDialogVisible = true; registerDialogVisible = false"
  />
</p-dialog>

<p-dialog
  header=""
  [(visible)]="loginDialogVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
>
  <frontend-login-form
    (registerRequested)="loginDialogVisible = false; registerDialogVisible = true"
  />
</p-dialog>
