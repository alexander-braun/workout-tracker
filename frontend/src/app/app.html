<div class="page">
  <header class="header">
    <div>
      <h1 class="heading">Workout Tracker</h1>
    </div>
    <div class="header-actions">
      <p-datepicker
        [ngModel]="store.selectedDate()"
        (ngModelChange)="store.setSelectedDate($event)"
        [showIcon]="true"
        iconDisplay="input"
        [readonlyInput]="true"
        dateFormat="D, M d, yy"
      />

      <button pButton type="button" class="menu-button" severity="secondary" aria-label="Menu">
        <i class="pi pi-ellipsis-h"></i>
      </button>
    </div>
  </header>
  <frontend-workout-log />
  <frontend-body-log />
  <frontend-nutrition-and-sleep-log />
</div>
