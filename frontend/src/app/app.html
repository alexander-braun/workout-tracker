<div class="page">
  <header class="header">
    <div>
      <h1 class="heading">Workout Tracker</h1>
      <h3 class="subheading">Log your exercises. See your progress.</h3>
    </div>
    <div class="header-actions">
      <p-datepicker
        [(ngModel)]="selectedDate"
        [showIcon]="true"
        iconDisplay="input"
        [readonlyInput]="true"
        dateFormat="D, M d, yy"
      />

      <button pButton type="button" class="menu-button" severity="secondary" aria-label="Menu">
        <i class="pi pi-ellipsis-h"></i>
      </button>
    </div>
  </header>
  <frontend-workout-log></frontend-workout-log>
  <frontend-progress-history></frontend-progress-history>
</div>
